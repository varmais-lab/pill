<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Arial,sans-serif;padding:14px;color:#1d332b}h2{font-size:20px}label{display:block;margin:14px 0 5px;font-size:13px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bdcfc4;border-radius:7px}button{background:#176b50;color:white;border:0;padding:12px 18px;border-radius:8px;margin-top:18px;cursor:pointer}p{font-size:13px;line-height:1.5}#status{color:#315b45}
</style></head><body><h2>Create the administrator</h2><p>This account can create users, manage their medicines, and reset passwords.</p><form id="form"><label for="name">Name</label><input id="name" required maxlength="100"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password (at least 10 characters)</label><input id="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><button id="submit">Create administrator</button><p id="status" role="status"></p></form><script>
document.querySelector('#form').onsubmit=async event=>{event.preventDefault();const button=document.querySelector('#submit'),status=document.querySelector('#status');button.disabled=true;status.textContent='Preparing account…';try{const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');const password=document.querySelector('#password').value;const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(salt.match(/../g),x=>parseInt(x,16)),iterations:600000},material,256);const passwordKey=Array.from(new Uint8Array(bits),x=>x.toString(16).padStart(2,'0')).join('');document.querySelector('#password').value='';google.script.run.withSuccessHandler(()=>{status.textContent='Administrator created. Deploy this script as a Web app: Execute as Me, access Anyone. Then paste the /exec URL into the Android app.';button.textContent='Created';}).withFailureHandler(error=>{status.textContent=error.message;button.disabled=false;}).bootstrapAdmin({name:document.querySelector('#name').value,email:document.querySelector('#email').value,salt,passwordKey});}catch(error){status.textContent=error.message;button.disabled=false;}};
</script></body></html>
